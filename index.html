<style>
  :root { --brand:#0f6cbd; --brand-dark:#0c5a9e; --bg:#f0f0f0; --pane:#fff; --line:#e1dfdd; --text:#242424; --muted:#616161; --danger:#c50f1f;
          --font:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue",Arial,sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a19; --pane:#252423; --line:#3b3a39; --text:#f3f2f1; --muted:#a19f9d; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); display: grid; place-items: center; padding: 24px 16px; }
  .card { background: var(--pane); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); width: min(440px, 100%); padding: 30px; }
  .lock { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; margin-bottom: 16px; }
  .lock svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
  input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #8a8886; border-radius: 4px; font: inherit; background: var(--pane); color: var(--text); }
  input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  button { margin-top: 16px; width: 100%; height: 40px; border: 0; border-radius: 4px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
  button:disabled { background: #c8c6c4; cursor: progress; }
  .err { color: var(--danger); font-size: 13px; margin: 12px 0 0; min-height: 1.1em; }
  .foot { margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>

    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: dec(P.salt), iterations: P.iter, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dec(P.iv) }, key, dec(P.ct));
    return new TextDecoder().decode(buf);
  }
  const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { err.textContent = "This page needs a secure (https) connection to unlock. Please open it via the link you were sent."; return; }
    err.textContent = ""; go.disabled = true; go.textContent = "Unlocking\u2026";

      const html = await unlock(pw.value);
